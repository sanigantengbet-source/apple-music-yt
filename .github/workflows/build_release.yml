name: Build Multi-Platform & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo-ndk binary
        uses: actions/cache@v4
        id: cache-cargo-ndk
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v3.5.8

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Build Rust Native Library for Android
        working-directory: native
        run: |
          # Automatically detect Android NDK path on GitHub runner
          if [ -z "$ANDROID_NDK_HOME" ]; then
            if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
              export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            elif [ -d "$ANDROID_HOME/ndk" ]; then
              export ANDROID_NDK_HOME=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
            fi
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          mkdir -p ../android/app/src/main/jniLibs
          cargo ndk --platform 21 -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
          echo "Generated native libraries:"
          ls -la ../android/app/src/main/jniLibs/*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory Exists
        run: mkdir -p assets/images

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Dart Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK Generated
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK file not found at $APK_PATH"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Release APK verified successfully: $APK_PATH ($APK_SIZE bytes)"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "::error::Generated APK is suspiciously small ($APK_SIZE bytes)"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-yt-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Native Library for Linux
        working-directory: native
        run: cargo build --release

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory Exists
        run: mkdir -p assets/images

      - name: Generate Linux Platform Scaffolding & Dependencies
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .
          flutter pub get

      - name: Build Linux Bundle
        run: |
          flutter build linux --release
          mkdir -p build/linux/x64/release/bundle/lib
          cp native/target/release/libytmusic_rust.so build/linux/x64/release/bundle/lib/ || true

      - name: Verify Linux Bundle
        run: |
          if [ ! -d "build/linux/x64/release/bundle" ]; then
            echo "::error::Linux bundle directory not found"
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-yt-linux-bundle
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Native Library for Windows
        working-directory: native
        run: cargo build --release

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Ensure Assets Directory Exists
        shell: bash
        run: mkdir -p assets/images

      - name: Generate Windows Platform Scaffolding & Dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get

      - name: Build Windows Executable
        run: |
          flutter build windows --release
          Copy-Item -Path "native/target/release/ytmusic_rust.dll" -Destination "build/windows/x64/runner/Release/" -ErrorAction SilentlyContinue

      - name: Verify Windows Release
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release")) {
            Write-Error "Windows release directory was not generated"
            exit 1
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-yt-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
