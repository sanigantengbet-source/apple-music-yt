name: apple_music_yt
description: "Apple Music UI Native Client powered by Rust and Dart with Background Audio Playback and YouTube Music API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  http: ^1.2.0
  ffi: ^2.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
