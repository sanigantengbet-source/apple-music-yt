[package]
name = "ytmusic_rust"
version = "0.1.0"
edition = "2021"
description = "Native Rust core for YouTube Music streaming and API decoding"

[lib]
name = "ytmusic_rust"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.9", features = ["json"] }
regex = "1.10"
libc = "0.2"
